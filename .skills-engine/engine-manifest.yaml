schema_version: "1.0"
engine_id: social-media-skills
display_name: Digital Marketing and Advertising (social-media-skills)
contract_version: "1.0"
version: "1.2.0"
router:
  path: AGENTS.md
skills:
  discovery_glob: skills/**/SKILL.md
validation:
  - id: release-gate
    command: >-
      python -X utf8 scripts/validate_skill_engine.py --baseline quality-baseline.json
    working_directory: .
    platforms:
      - windows
      - linux
      - macos
  - id: routing-gate
    command: python -X utf8 scripts/routing_smoke_test.py --lint-fixtures
    working_directory: .
    platforms: [windows, linux, macos]
  - id: alias-gate
    command: python -X utf8 scripts/check_skill_aliases.py
    working_directory: .
    platforms: [windows, linux, macos]
  - id: source-freshness-gate
    command: python -X utf8 scripts/check_source_freshness.py
    working_directory: .
    platforms: [windows, linux, macos]
agent_integration:
  supported_modes: [full, sequential, read_only, not_assessed]
  local_context_files: [AGENTS.md, .skills-engine/AGENTS-INTEGRATION.md]
  mcp_safe_tools: [discover_engine, read_router, read_skill, validate_documented_checks]
  approval_required_for: [write_files, pull, update, publish, external_message]
  forbidden_operations: [git_reset, git_clean, force_push, arbitrary_shell, broad_delete]
  fork_behavior: inspect_local_router_without_inventing_validators
source_of_truth:
  router: AGENTS.md
  skills: skills/**/SKILL.md
  references: references/**
  aliases: docs/skill-aliases.yml
invariants:
  - id: british-english
    phrase: "Use British English throughout unless the target market or requested language requires otherwise."
  - id: book-extraction-ban
    phrase: "Never store book extractions or book summaries in this repository (owner rule, 2026-09-23)."
  - id: not-assessed
    phrase: "Missing source, rights, platform, render, approval, or performance evidence is `NOT ASSESSED`, never a pass."
